  <a href="#/" class="brand">
    <span class="brand-name" data-i18n="brand">Nhật Báo Thế Giới</span>

</header>
<nav class="nav" aria-label="Countries">
  <div class="wrap nav-in" id="countryNav"></div>
</nav>
<nav class="subnav" aria-label="Topics">
  <div class="wrap nav-in" id="topicNav"></div>
</nav>

    <p class="foot-brand" data-i18n="brand">Nhật Báo Thế Giới</p>
    <p data-i18n="about">Trang tổng hợp cá nhân. Tiêu đề và tóm tắt lấy từ RSS chính thức của từng tờ báo, kèm đường dẫn tới bài gốc. Bản dịch (nếu có) là dịch máy, hãy đối chiếu với bài gốc.</p>
    <p id="footMeta" class="muted"></p>
  </div>
</footer>
